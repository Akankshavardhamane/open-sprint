<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Universe | Interactive Discovery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">🌌 CURSOR<span>UNIVERSE</span></div>
        <div class="status">Mode: <span id="current-mode">Explorer</span></div>
    </nav>

    <div class="instructions">Move to discover hidden zones • Click to burst</div>

    <canvas id="canvas"></canvas>

    <div class="controls glass">

        <!-- Existing Controls -->
        <div class="control-group">
            <label>Sound</label>
            <button id="toggle-audio" class="btn">OFF</button>
        </div>

        <div class="control-group">
            <label>Size</label>
            <input type="range" id="size-slider" min="1" max="10" value="3">
        </div>

        <button id="clear-btn" class="btn-danger">Clear Space</button>

        <!-- ⭐ NEW FEATURE: MODE SELECTOR -->
        <div class="control-group">
            <label>Mode</label>
            <select id="mode-selector" class="btn">
                <option value="auto">Auto</option>
                <option value="star">Star</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="blackhole">Black Hole</option>
                <option value="lightning">Lightning</option>
            </select>
        </div>

    </div>

    <footer class="footer">
        <p>Made with Colors for the Universe | <span class="easter-egg">Don't click the logo...</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
